# OpenAPI 根入口只负责聚合模块；路径和模型分别维护在 paths/ 与 components/。
openapi: 3.1.1
info:
  title: Atlasloom API
  version: 1.0.0
  description: Browser and data-sync API for the reusable travel planner. The host Nginx exposes it below
    /{APP_BASE_PATH}/api.
servers:
- url: /travel/api
security:
- sessionCookie: []
tags:
- name: 系统
- name: 认证与个人资料
- name: 基础库
- name: 旅行
- name: 旅行资料
- name: 快照
- name: 旅行备份
- name: 地图与天气
paths:
  /healthz:
    $ref: ./paths/system.yaml#/~1healthz
  /auth/bootstrap:
    $ref: ./paths/auth.yaml#/~1auth~1bootstrap
  /auth/users:
    $ref: ./paths/auth.yaml#/~1auth~1users
  /auth/login:
    $ref: ./paths/auth.yaml#/~1auth~1login
  /auth/logout:
    $ref: ./paths/auth.yaml#/~1auth~1logout
  /session:
