  /profile:
    $ref: ./paths/auth.yaml#/~1profile
  /library:
    $ref: ./paths/library.yaml#/~1library
  /library/snapshot:
    $ref: ./paths/library.yaml#/~1library~1snapshot
  /library/tags/presets:
    $ref: ./paths/library.yaml#/~1library~1tags~1presets
  /library/{libraryResource}:
    $ref: ./paths/library.yaml#/~1library~1{libraryResource}
  /library/{libraryResource}/{libraryRecordId}:
    $ref: ./paths/library.yaml#/~1library~1{libraryResource}~1{libraryRecordId}
  /library/{libraryResource}/{libraryRecordId}/deletion-impact:
    $ref: ./paths/library.yaml#/~1library~1{libraryResource}~1{libraryRecordId}~1deletion-impact
  /trips:
    $ref: ./paths/trips.yaml#/~1trips
  /trip-imports/preview:
    $ref: ./paths/backups.yaml#/~1trip-imports~1preview
  /trip-imports/apply:
    $ref: ./paths/backups.yaml#/~1trip-imports~1apply
  /trips/{tripId}:
    $ref: ./paths/trips.yaml#/~1trips~1{tripId}
  /trips/{tripId}/overview:
    $ref: ./paths/trips.yaml#/~1trips~1{tripId}~1overview
  /trips/{tripId}/backup:
    $ref: ./paths/backups.yaml#/~1trips~1{tripId}~1backup
  /trips/{tripId}/route:
    $ref: ./paths/maps.yaml#/~1trips~1{tripId}~1route
  /trips/{tripId}/{resource}:
    $ref: ./paths/records.yaml#/~1trips~1{tripId}~1{resource}
  /trips/{tripId}/{resource}/reorder:
    $ref: ./paths/records.yaml#/~1trips~1{tripId}~1{resource}~1reorder
  /trips/{tripId}/days/{dayId}/places:
    $ref: ./paths/records.yaml#/~1trips~1{tripId}~1days~1{dayId}~1places
  /trips/{tripId}/audit-logs:
    $ref: ./paths/records.yaml#/~1trips~1{tripId}~1audit-logs
  /trips/{tripId}/members/{recordId}/deletion-impact:
    $ref: ./paths/records.yaml#/~1trips~1{tripId}~1members~1{recordId}~1deletion-impact
  /trips/{tripId}/weather:
    $ref: ./paths/maps.yaml#/~1trips~1{tripId}~1weather
  /trips/{tripId}/map-config:
    $ref: ./paths/maps.yaml#/~1trips~1{tripId}~1map-config
  /trips/{tripId}/place-search:
    $ref: ./paths/maps.yaml#/~1trips~1{tripId}~1place-search
  /trips/{tripId}/reverse-geocode:
    $ref: ./paths/maps.yaml#/~1trips~1{tripId}~1reverse-geocode
  /_AMapService/v3/direction/driving:
    $ref: ./paths/maps.yaml#/~1_AMapService~1v3~1direction~1driving
  /_AMapService/v3/direction/walking:
    $ref: ./paths/maps.yaml#/~1_AMapService~1v3~1direction~1walking
  /_AMapService/v3/direction/transit/integrated:
    $ref: ./paths/maps.yaml#/~1_AMapService~1v3~1direction~1transit~1integrated
  /_AMapService/v5/direction/driving:
    $ref: ./paths/maps.yaml#/~1_AMapService~1v5~1direction~1driving
  /_AMapService/v5/direction/walking:
    $ref: ./paths/maps.yaml#/~1_AMapService~1v5~1direction~1walking
  /_AMapService/v3/place/text:
    $ref: ./paths/maps.yaml#/~1_AMapService~1v3~1place~1text
  /_AMapService/v3/geocode/regeo:
    $ref: ./paths/maps.yaml#/~1_AMapService~1v3~1geocode~1regeo
  /trips/{tripId}/{resource}/{recordId}:
    $ref: ./paths/records.yaml#/~1trips~1{tripId}~1{resource}~1{recordId}
  /trips/{tripId}/snapshots:
    $ref: ./paths/snapshots.yaml#/~1trips~1{tripId}~1snapshots
  /trips/{tripId}/snapshots/{snapshotId}:
    $ref: ./paths/snapshots.yaml#/~1trips~1{tripId}~1snapshots~1{snapshotId}
  /trips/{tripId}/snapshots/{snapshotId}/restore-preview:
    $ref: ./paths/snapshots.yaml#/~1trips~1{tripId}~1snapshots~1{snapshotId}~1restore-preview
  /trips/{tripId}/snapshots/{snapshotId}/restore:
    $ref: ./paths/snapshots.yaml#/~1trips~1{tripId}~1snapshots~1{snapshotId}~1restore
  /trips/{tripId}/snapshot-imports/preview:
    $ref: ./paths/snapshots.yaml#/~1trips~1{tripId}~1snapshot-imports~1preview
  /trips/{tripId}/snapshot-imports/apply:
    $ref: ./paths/snapshots.yaml#/~1trips~1{tripId}~1snapshot-imports~1apply
