# 旅行数据结构。
schemas:
  Trip:
    description: Complete persisted Trip state used by snapshots and portable backups; it never contains an access role.
    type: object
    additionalProperties: false
    required:
    - id
    - title
    - summary
    - startDate
    - endDate
    - timezone
    - currency
    - version
    - createdAt
    - updatedAt
    properties:
      id:
        type: string
        pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
      title:
        type: string
        minLength: 1
      summary:
        type: string
      startDate:
        type: string
        format: date
      endDate:
        type: string
        format: date
        description: The inclusive trip range may contain at most 366 calendar days.
      timezone:
        type: string
      currency:
        type: string
      version:
        type: integer
        minimum: 1
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      deletedAt:
        type: string
        format: date-time
      deletedByMemberId:
        type: string
  TripView:
    description: Active Trip projection returned by the API; list entries include role when the current member has Trip access.
    type: object
    additionalProperties: false
    required:
    - id
    - title
    - summary
    - startDate
    - endDate
    - timezone
    - currency
    - version
    - createdAt
    - updatedAt
    properties:
      id:
        type: string
        pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
        readOnly: true
      title:
        type: string
        minLength: 1
      summary:
        type: string
      startDate:
        type: string
        format: date
      endDate:
        type: string
        format: date
        description: The inclusive trip range may contain at most 366 calendar days.
      timezone:
        type: string
      currency:
        type: string
      version:
        type: integer
        minimum: 1
        readOnly: true
      createdAt:
        type: string
        format: date-time
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        readOnly: true
      role:
        type: string
        enum:
        - owner
        - editor
        - viewer
        readOnly: true
  TripCreate:
    description: Client-supplied fields for creating a Trip; omitted summary, timezone, and currency use server defaults.
    type: object
    additionalProperties: false
    required:
    - id
    - title
    - startDate
    - endDate
    properties:
      id:
        type: string
        pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
      title:
        type: string
        minLength: 1
      summary:
        type: string
        default: ''
      startDate:
        type: string
        format: date
      endDate:
        type: string
        format: date
        description: The inclusive trip range may contain at most 366 calendar days.
      timezone:
        type: string
        default: Asia/Shanghai
      currency:
        type: string
        default: CNY
  TripPatch:
    description: Editable Trip fields; the resulting date range may contain at most 366 calendar days and cannot exclude an existing Day.
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      title:
        type: string
        minLength: 1
      summary:
        type: string
      startDate:
        type: string
        format: date
      endDate:
        type: string
        format: date
      timezone:
        type: string
      currency:
        type: string
  TripsResponse:
    type: object
    additionalProperties: false
    required:
    - trips
    properties:
      trips:
        type: array
        items:
          $ref: '#/schemas/TripView'
  TripResponse:
    type: object
    additionalProperties: false
    required:
    - trip
    properties:
      trip:
        $ref: '#/schemas/TripView'
  TripCreateResponse:
    type: object
    additionalProperties: false
    required:
    - trip
    - snapshot
    - replayed
    properties:
      trip:
        $ref: '#/schemas/TripView'
      snapshot:
        $ref: ./snapshots.yaml#/schemas/SnapshotSummary
      replayed:
        type: boolean
  TripMutationResponse:
    type: object
    additionalProperties: false
    required:
    - trip
    - snapshot
    properties:
      trip:
        $ref: '#/schemas/TripView'
      snapshot:
        $ref: ./snapshots.yaml#/schemas/SnapshotSummary
  TripDeleteResponse:
    type: object
    additionalProperties: false
    required:
    - deleted
    - snapshot
    properties:
      deleted:
        type: boolean
        const: true
      snapshot:
        $ref: ./snapshots.yaml#/schemas/SnapshotSummary
  TripOverviewResponse:
    type: object
    additionalProperties: false
    required:
    - counts
    properties:
      counts:
        type: object
        additionalProperties: false
        required:
        - days
        - places
        - segments
        - bookings
        - expenses
        - packing-items
        - research-evidence
        - members
        properties:
          days:
            type: integer
            minimum: 0
          places:
            type: integer
            minimum: 0
          segments:
            type: integer
            minimum: 0
          bookings:
            type: integer
            minimum: 0
          expenses:
            type: integer
            minimum: 0
          packing-items:
            type: integer
            minimum: 0
            description: Number of packing items owned by the current authenticated member
          research-evidence:
            type: integer
            minimum: 0
          members:
            type: integer
            minimum: 0
